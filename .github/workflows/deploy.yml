name: build and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Pinned to ruff.toml's required-version: the default rule set moves
      # between minors, and a gate that grades to a different standard is worse
      # than none.
      - name: Install ruff
        run: pipx install 'ruff>=0.16,<0.17'

      # Keyed on the lockfile, so the cache turns over exactly when the pinned
      # Playwright version does. --with-deps still runs: the OS packages are not
      # in this path and are cheap, the ~200MB of browsers are the slow half.
      - name: Cache browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browsers
        run: npx playwright install --with-deps

      # `make ci`, not the steps one at a time. scripts/ci already lists every
      # gate and runs them in a thread pool, so enumerating them here was a
      # second copy of that list, kept in step by hand, running serially.
      # It builds dist/ first, which is what the upload below publishes.
      - name: Every gate
        run: make ci

      - name: The artifact is complete and stripped
        run: |
          test -s dist/index.html && test -s dist/site.css \
            && test -s dist/home.css && test -d dist/assets && test -s dist/home.js
          # Losing CNAME is silent and total: the site moves to github.io.
          test -s dist/CNAME
          ! grep -q '<!--' dist/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Build and check run on every PR; only main publishes.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
