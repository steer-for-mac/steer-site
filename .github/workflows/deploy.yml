name: build and deploy

# The site is assembled by Eleventy (_includes/, a layout, front matter) and its two
# sheets by Lightning CSS, so Pages cannot serve the repo as-is: it has to build
# first. What gets published is dist/ and only dist/, which is what retired the
# subtractive `rm -rf docs bin scripts ...` step that used to stand between the
# checkout and the artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # One production build, and every check below runs against it. Stripping
      # used to happen in a second pass after the checks, because the checks
      # compared against committed files and those were the un-stripped ones;
      # that is how 111 dev comments shipped. Nothing is committed now.
      - name: Build the site
        run: make build

      # Comments are 17% of the homepage and they cite docs/ paths and commit
      # hashes. Assert the strip happened: an existence check alone would pass on
      # a silently no-op build, which is the failure this closes.
      - name: The artifact is complete and stripped
        run: |
          test -s dist/index.html && test -s dist/site.css \
            && test -s dist/home.css && test -d dist/assets && test -s dist/home.js
          # CNAME is the one whose loss is silent AND total: without it the
          # artifact is complete and correct, every check passes, the site
          # publishes to <user>.github.io, and steer.seanfloyd.dev simply stops
          # resolving. It is one addPassthroughCopy line away at any time.
          test -s dist/CNAME
          ! grep -q '<!--' dist/index.html

      - name: Structural accessibility invariants
        run: scripts/a11y-check

      # `make lint-css` / `make lint-html`, not the tools' own globs: the
      # Makefile is where a task is defined, and this file holding its own copy
      # of the stylelint glob is how it got out of step with the sheets on disk
      # before.
      - name: CSS lint
        run: make lint-css

      # Reads dist/, which the production build above already wrote.
      - name: Markup lint
        run: make lint-html

      - name: JS lint
        run: make lint-js

      # ruff is not an npm package, so `npm ci` above does not bring it. Pinned
      # to the range ruff.toml's `required-version` declares: ruff's default
      # rule set moves between minor versions, and a gate that silently grades
      # to a different standard than the one the files were burned down against
      # is the failure this repo keeps finding. pipx is preinstalled on the
      # runner image.
      - name: Install ruff
        run: pipx install 'ruff>=0.16,<0.17'

      - name: Python lint
        run: make lint-py

      # Reads styles/tokens.css only: no build, no browser, ~0.2s.
      - name: Token contrast (AA on the darkest surface)
        run: make contrast

      - name: Copy and design rules
        run: |
          node scripts/curb-check.mjs
          node scripts/curb-check.mjs --self-test

      - name: Install headless Chrome
        run: npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/puppeteer"

      # Playwright brings its own browser build and will not use the one above;
      # scripts/shots.mjs and scripts/axe-check.mjs still use that one, so both
      # installs are needed until those two move over too. `--with-deps` pulls
      # the shared libraries the runner image lacks.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Behaviour, not markup: the only step here that presses a button. It
      # starts its own static server (see playwright.config.js), so it belongs
      # above the container step rather than depending on nginx.
      - name: Behaviour (theme toggle, controller picker)
        run: npx playwright test

      # `make a11y`, not the node command: the Makefile is where a task is
      # defined. Runs its own in-process server, so it goes above the Serve step
      # rather than needing the container. axe-core over WCAG 2 A/AA, ~7s.
      - name: Accessibility (axe-core)
        run: make a11y

      # Serve with the same nginx config that runs locally, and drive it with a
      # browser on the runner. Chrome inside the image would be a 958MB build
      # for no gain: the checks need a browser, not a container, and pointing
      # them at nginx is what actually exercises try_files and the MIME types.
      - name: Serve
        run: docker compose up -d --wait

      - name: Render every band
        env:
          BASE_URL: http://127.0.0.1:8391
        run: node scripts/shots.mjs --out /tmp/ci-shots

      - name: Unreachable CSS
        run: scripts/purge-check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
