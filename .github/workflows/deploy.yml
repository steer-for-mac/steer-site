name: build and deploy

# The site is assembled by Eleventy (parts/, a layout, front matter) and its two
# sheets by Lightning CSS, so Pages cannot serve the repo as-is: it has to build
# first. What gets published is _site/ and only _site/, which is what retired the
# subtractive `rm -rf docs bin scripts ...` step that used to stand between the
# checkout and the artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # One production build, and every check below runs against it. Stripping
      # used to happen in a second pass after the checks, because the checks
      # compared against committed files and those were the un-stripped ones;
      # that is how 111 dev comments shipped. Nothing is committed now.
      - name: Build the site
        run: ELEVENTY_ENV=production npx eleventy

      # Comments are 17% of the homepage and they cite docs/ paths and commit
      # hashes. Assert the strip happened: an existence check alone would pass on
      # a silently no-op build, which is the failure this closes.
      - name: The artifact is complete and stripped
        run: |
          test -s _site/index.html && test -s _site/styles.css \
            && test -s _site/home.css && test -d _site/assets && test -s _site/home.js
          # CNAME is the one whose loss is silent AND total: without it the
          # artifact is complete and correct, every check passes, the site
          # publishes to <user>.github.io, and steer.seanfloyd.dev simply stops
          # resolving. It is one addPassthroughCopy line away at any time.
          test -s _site/CNAME
          ! grep -q '<!--' _site/index.html

      - name: Structural accessibility invariants
        run: bin/a11y-check

      # html-validate is absent on purpose: it used to lint parts/*.html against
      # a config that switched eight rules off because fragments are not
      # documents. The fragments are Nunjucks now. Linting _site/**/*.html is the
      # right replacement and is tracked separately: it reports 103 pre-existing
      # errors today, 98 of them inline styles.
      - name: CSS lint
        run: npx stylelint 'styles/*.css' 'parts/*.css'

      - name: Copy and design rules
        run: |
          node scripts/curb-check.mjs
          node scripts/curb-check.mjs --self-test

      - name: Install headless Chrome
        run: npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/puppeteer"

      # Serve with the same nginx config that runs locally, and drive it with a
      # browser on the runner. Chrome inside the image would be a 958MB build
      # for no gain: the checks need a browser, not a container, and pointing
      # them at nginx is what actually exercises try_files and the MIME types.
      - name: Serve
        run: docker compose up -d --wait

      - name: Render every band
        env:
          BASE_URL: http://127.0.0.1:8391
        run: node scripts/shots.mjs --out /tmp/ci-shots

      - name: Unreachable CSS
        run: bin/purge-check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
