name: build and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # One build; every check below reads it.
      - name: Build the site
        run: make build

      - name: The artifact is complete and stripped
        run: |
          test -s dist/index.html && test -s dist/site.css \
            && test -s dist/home.css && test -d dist/assets && test -s dist/home.js
          # Losing CNAME is silent and total: the site moves to github.io.
          test -s dist/CNAME
          ! grep -q '<!--' dist/index.html

      - name: Structural accessibility invariants
        run: scripts/a11y-check

      - name: CSS lint
        run: make lint-css

      - name: Markup lint
        run: make lint-html

      - name: JS lint
        run: make lint-js

      # Pinned to ruff.toml's required-version: the default rule set moves
      # between minors, and a gate that grades to a different standard is worse
      # than none.
      - name: Install ruff
        run: pipx install 'ruff>=0.16,<0.17'

      - name: Python lint
        run: make lint-py

      - name: Token contrast (AA on the darkest surface)
        run: make contrast

      - name: Copy and design rules
        run: |
          node scripts/curb-check.mjs
          node scripts/curb-check.mjs --self-test

      # CHROME_PATH lets shots/cssdiff/axe-check share this browser.
      - name: Install browsers
        run: |
          npx playwright install --with-deps
          echo "CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      # Behaviour, not markup: the only step here that presses a button. It
      # starts its own static server (see playwright.config.js), so it belongs
      # above the container step rather than depending on nginx.
      - name: Behaviour (theme toggle, controller picker)
        run: npx playwright test

      # `make a11y`, not the node command: the Makefile is where a task is
      # defined. Runs its own in-process server, so it goes above the Serve step
      # rather than needing the container. axe-core over WCAG 2 A/AA, ~7s.
      - name: Accessibility (axe-core)
        run: make a11y

      # Serve with the same nginx config that runs locally, and drive it with a
      # browser on the runner. Chrome inside the image would be a 958MB build
      # for no gain: the checks need a browser, not a container, and pointing
      # them at nginx is what actually exercises try_files and the MIME types.
      - name: Serve
        run: docker compose up -d --wait

      - name: Render every band
        env:
          BASE_URL: http://127.0.0.1:8391
        run: node scripts/shots.mjs --out /tmp/ci-shots

      - name: Unreachable CSS
        run: scripts/purge-check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Build and check run on every PR; only main publishes.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
