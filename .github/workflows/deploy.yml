name: build and deploy

# Docs and notes never reach dist/, so they do not need the whole suite.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

# Read-only by default; only the deploy job may write to Pages.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Every job starts at once and builds dist/ itself (seconds, with the image
# cache); nothing waits on another job's artifact. Measured 2026-11-03 across
# four variants: one browser job per engine at 4 workers was fastest (106s to
# the gate against 179s with five shards); more shards only added setup. A small gate requires every
# check to pass before deploy publishes the build job's copy.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/pads/given/
            !/tools/life/masters/
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: ./.github/actions/build-site
      # The image cache falls back to an older encode set, which can hold
      # images since removed; only what this build references is published.
      - run: scripts/prune-img dist
      - name: The artifact is complete and stripped
        run: |
          test -s dist/index.html && test -s dist/site.css \
            && test -s dist/home.css && test -d dist/assets && test -s dist/home.js
          # Losing CNAME is silent and total: the site moves to github.io.
          test -s dist/CNAME
          ! grep -q '<!--' dist/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Everything that reads the page rather than driving it.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/pads/given/
            !/tools/life/masters/
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: ./.github/actions/build-site
      # ruff.toml's required-version, read rather than copied: the default rule
      # set moves between minors, and a copy here went stale on the 0.17 bump.
      - name: Install ruff
        run: |
          spec=$(sed -n 's/^required-version = "\(.*\)"$/\1/p' ruff.toml)
          [ -n "$spec" ] || { echo "no required-version in ruff.toml" >&2; exit 1; }
          pipx install "ruff$spec"
      - run: scripts/ci --no-build --no-browser
      # The workflows themselves: a typo in a `needs:` or an expression is
      # otherwise found by a run that never starts. Pinned release, checksum
      # checked against the value copied from its checksums.txt.
      - name: actionlint
        run: |
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint -color

  # The Playwright suite in Playwright's own image (browsers preinstalled; the
  # tag must match the version package-lock.json pins). Shards sized from the
  # timings artifact: WebKit runs ~2.5x Chromium. Do not drop WebKit: the
  # popover menu was unclosable in Safari while Chromium passed.
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    name: browser (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tools/pads/given/
            !/tools/life/masters/
      - name: The image matches the pinned Playwright
        run: |
          want=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')
          [ "$want" = "1.64.1" ] || { echo "package-lock pins Playwright $want; bump the image tag above" >&2; exit 1; }
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: ./.github/actions/build-site
      - run: bun x playwright test --project=${{ matrix.project }} --workers=4 --reporter=github,list,json
        env:
          CI: "1"
          PLAYWRIGHT_JSON_OUTPUT_FILE: timings.json
      # Per-test durations, kept so the shard counts stay sized from data.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.project }}-${{ strategy.job-index }}
          path: timings.json
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.project }}-${{ strategy.job-index }}
          path: test-results
          retention-days: 7

  # The one required result: every check passed, none skipped or cancelled.
  gate:
    needs: [build, static, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
