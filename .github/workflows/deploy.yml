name: build and deploy

# index.html and home.css are generated from parts/, so Pages cannot serve the
# repo as-is: it has to build first. bin/build is stdlib python, and the checks
# below are the repo's own dependency-free scripts, so this needs no lockfile
# and nothing to install beyond a headless Chrome for the rendering gates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # --prod strips the design-rationale comments, which are 17% of index.html
      # and written for whoever edits parts/ next rather than for visitors.
      - name: Assemble the page
        run: bin/build --prod

      # The generated files are committed, so a mismatch means someone edited
      # index.html directly or forgot to rebuild. Fail rather than quietly
      # shipping something nobody reviewed.
      # A dev build here, because --check compares against the committed files
      # and those are the un-stripped ones.
      - name: Generated files match parts/
        run: bin/build && bin/build --check

      - name: Structural accessibility invariants
        run: bin/a11y-check

      - name: HTML and CSS lint
        run: |
          npx html-validate 'parts/*.html'
          npx stylelint 'styles/*.css' 'parts/*.css'

      - name: Copy and design rules
        run: |
          node scripts/curb-check.mjs
          node scripts/curb-check.mjs --self-test

      - name: Install headless Chrome
        run: npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/puppeteer"

      # Serve with the same nginx config that runs locally, and drive it with a
      # browser on the runner. Chrome inside the image would be a 958MB build
      # for no gain: the checks need a browser, not a container, and pointing
      # them at nginx is what actually exercises try_files and the MIME types.
      - name: Serve
        run: docker compose up -d --wait

      - name: Render every band
        env:
          BASE_URL: http://127.0.0.1:8391
        run: node scripts/shots.mjs --out /tmp/ci-shots

      - name: Unreachable CSS
        run: bin/purge-check

      # `path: .` publishes the whole checkout, which put CLAUDE.md on the live
      # site (200, not a 404). Subtractive rather than an allowlist on purpose:
      # forgetting an entry here leaves a file published, which is the status
      # quo, where forgetting one in an allowlist would silently 404 a real
      # page. Task 7 replaces this with a dist/ directory that only ever holds
      # shipped output, at which point this step goes away.
      # The --prod build at the top of this job is overwritten by the plain
      # `bin/build` that --check needs, and nothing put it back, so the
      # published index.html shipped 111 dev comments citing docs/ paths and
      # commit hashes. Re-strip here, after every check that wants the dev
      # build has run, or the step below deletes docs/ while the largest quote
      # of it sails past in the HTML.
      - name: Strip dev comments and remove sources from the artifact
        run: |
          bin/build --prod
          rm -rf docs bin scripts parts styles docker .github node_modules
          rm -f CLAUDE.md AGENTS.md Makefile compose.yaml package.json \
                package-lock.json purgecss.config.js index.src.html \
                .stylelintrc.json .htmlvalidate.json
          test -f index.html && test -f styles.css && test -f home.css \
            && test -d assets && test -s home.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
