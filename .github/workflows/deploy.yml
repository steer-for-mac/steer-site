name: build and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # One build; every check below reads it.
      - name: Build the site
        run: make build

      - name: The artifact is complete and stripped
        run: |
          test -s dist/index.html && test -s dist/site.css \
            && test -s dist/home.css && test -d dist/assets && test -s dist/home.js
          # Losing CNAME is silent and total: the site moves to github.io.
          test -s dist/CNAME
          ! grep -q '<!--' dist/index.html

      - name: Structural accessibility invariants
        run: scripts/a11y-check

      - name: CSS lint
        run: make lint-css

      - name: Markup lint
        run: make lint-html

      - name: JS lint
        run: make lint-js

      # Pinned to ruff.toml's required-version: the default rule set moves
      # between minors, and a gate that grades to a different standard is worse
      # than none.
      - name: Install ruff
        run: pipx install 'ruff>=0.16,<0.17'

      - name: Python lint
        run: make lint-py

      - name: Token contrast (AA on the darkest surface)
        run: make contrast

      - name: Copy and design rules
        run: |
          node scripts/curb-check.mjs
          node scripts/curb-check.mjs --self-test

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: Behaviour, accessibility and layout (Playwright)
        run: npx playwright test

      - name: Unreachable CSS
        run: scripts/purge-check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Build and check run on every PR; only main publishes.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
