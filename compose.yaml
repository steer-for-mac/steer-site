# Serve the static site over HTTP, which the page now requires: the SVG symbols
# in assets/svg/ are pulled in with <use href="…svg#s"> and browsers refuse to
# resolve that over file://.
#
#   docker compose up -d      -> https://steer.seanfloyd.dev.local
#   docker compose down
#
# This is the only way to serve the site. A plain static server is not an
# equivalent: it has no try_files, so /buy would 404 locally and work on Pages,
# and a dev server that behaves differently from production is worse than none.
# OrbStack reads dev.orbstack.domains off the container and routes the name
# to the exposed port with TLS, so no ports need publishing to the host.
services:
  site:
    image: nginx:alpine
    restart: unless-stopped
    labels:
      - dev.orbstack.domains=steer.seanfloyd.dev.local
    volumes:
      # read-only: the container serves the working tree, it never writes to it
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
