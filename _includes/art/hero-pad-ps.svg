<svg viewBox="0 0 1200 440" aria-hidden="true">
        <ellipse class="contact" cx="600" cy="428" rx="275" ry="14"/>
        <g class="device">
          <!-- shoulders: L2 trigger angled up behind, L1 bumper bar hugging the body edge -->
          <g id="psShoL">
            <path stroke="var(--pa-ol-a)" d="M420,82 C412,66 413,50 423,42 C433,35 452,33 467,36 C479,39 487,46 488,54 L485,70 Z" fill="url(#trigTopGrad)"/>
            <path stroke="var(--pa-rim)" d="M425,44 C433,36 450,34 464,37" fill="none" stroke-width="1.5" stroke-linecap="round"/>
            <g clip-path="url(#psTrigClip)">
              <path fill="var(--pa-cast)" transform="translate(0,-3)" d="M408,97 C404,90 405,83 410,77 C424,63 448,55 474,50 C488,47 500,48 504,52 C506,55 506,58 504,60 C478,63 452,70 432,80 C422,85 414,91 411,97 Z"/>
            </g>
            <path stroke="var(--pa-ol-a)" d="M408,97 C404,90 405,83 410,77 C424,63 448,55 474,50 C488,47 500,48 504,52 C506,55 506,58 504,60 C478,63 452,70 432,80 C422,85 414,91 411,97 Z" fill="url(#bumpGrad)"/>
            <path stroke="var(--pa-rim)" d="M412,78 C426,64 450,56 474,51" fill="none" stroke-width="1.5" stroke-linecap="round"/>
          </g>
          <use href="#psShoL" transform="matrix(-1 0 0 1 1200 0)"/>

          <!-- body -->
          <path stroke="var(--pa-ol-b)" d="M600,48 C670,48 725,56 765,74 C805,92 822,120 836,160 C852,208 872,268 880,320 C887,368 883,410 850,428 C826,441 796,436 778,410 C760,382 750,346 728,322 C706,299 660,290 600,290 C540,290 494,299 472,322 C450,346 440,382 422,410 C404,436 374,441 350,428 C317,410 313,368 320,320 C328,268 348,208 364,160 C378,120 395,92 435,74 C475,56 530,48 600,48 Z"
                fill="url(#bodyGrad)" stroke-width="1.5"/>
          <path stroke="var(--pa-rim)" d="M470,66 C510,54 552,49 600,49 C648,49 690,54 730,66" fill="none" stroke-width="2" stroke-linecap="round"/>
          <!-- grip seams -->
          <path stroke="var(--pa-seam)" d="M478,296 C462,318 452,348 447,382" fill="none" stroke-width="2"/>
          <path stroke="var(--pa-seam)" d="M722,296 C738,318 748,348 753,382" fill="none" stroke-width="2"/>

          <!-- light spill inside the body (accent), plus the idle-rainbow hue stack -->
          <g clip-path="url(#psClip)">
            <ellipse class="bloom" fill="var(--accent)" cx="600" cy="136" rx="185" ry="95" filter="url(#soften)"/>
            <g class="rbbs" aria-hidden="true">
              <ellipse class="rbb hu1" cx="600" cy="136" rx="185" ry="95" filter="url(#soften)"/>
              <ellipse class="rbb hu2" style="animation-delay:-2s" cx="600" cy="136" rx="185" ry="95" filter="url(#soften)"/>
              <ellipse class="rbb hu3" style="animation-delay:-4s" cx="600" cy="136" rx="185" ry="95" filter="url(#soften)"/>
              <ellipse class="rbb hu4" style="animation-delay:-6s" cx="600" cy="136" rx="185" ry="95" filter="url(#soften)"/>
              <ellipse class="rbb hu5" style="animation-delay:-8s" cx="600" cy="136" rx="185" ry="95" filter="url(#soften)"/>
              <ellipse class="rbb hu6" style="animation-delay:-10s" cx="600" cy="136" rx="185" ry="95" filter="url(#soften)"/>
            </g>
          </g>

          <!-- touchpad -->
          <rect stroke="var(--pa-ol-b)" x="508" y="72" width="184" height="92" rx="28" fill="url(#padGrad)"/>

          <!-- light bar: one continuous strip wrapping the touchpad on three sides -->
          <g class="glow">
            <path stroke="var(--accent)" d="M502,86 L502,136 A34 34 0 0 0 536 170 L664,170 A34 34 0 0 0 698 136 L698,86" fill="none" stroke-width="6.5" stroke-linecap="round"/>
            <path d="M502,86 L502,136 A34 34 0 0 0 536 170 L664,170 A34 34 0 0 0 698 136 L698,86" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round"/>
          </g>
          <!-- idle rainbow: six hue copies crossfading on opacity, white core on top -->
          <g class="rbg" aria-hidden="true">
            <path class="rbl hu1" d="M502,86 L502,136 A34 34 0 0 0 536 170 L664,170 A34 34 0 0 0 698 136 L698,86"/>
            <path class="rbl hu2" style="animation-delay:-2s" d="M502,86 L502,136 A34 34 0 0 0 536 170 L664,170 A34 34 0 0 0 698 136 L698,86"/>
            <path class="rbl hu3" style="animation-delay:-4s" d="M502,86 L502,136 A34 34 0 0 0 536 170 L664,170 A34 34 0 0 0 698 136 L698,86"/>
            <path class="rbl hu4" style="animation-delay:-6s" d="M502,86 L502,136 A34 34 0 0 0 536 170 L664,170 A34 34 0 0 0 698 136 L698,86"/>
            <path class="rbl hu5" style="animation-delay:-8s" d="M502,86 L502,136 A34 34 0 0 0 536 170 L664,170 A34 34 0 0 0 698 136 L698,86"/>
            <path class="rbl hu6" style="animation-delay:-10s" d="M502,86 L502,136 A34 34 0 0 0 536 170 L664,170 A34 34 0 0 0 698 136 L698,86"/>
            <path class="rb-core" d="M502,86 L502,136 A34 34 0 0 0 536 170 L664,170 A34 34 0 0 0 698 136 L698,86"/>
          </g>
          <rect class="lb-reflect" fill="var(--accent)" x="508" y="72" width="184" height="92" rx="28"/>

          <!-- player LEDs -->
          <g class="pled" fill="var(--accent)" opacity="0.9">
            <circle cx="584" cy="182" r="2.2"/><circle cx="592" cy="182" r="2.2"/>
            <circle cx="600" cy="182" r="2.2"/><circle cx="608" cy="182" r="2.2"/>
            <circle cx="616" cy="182" r="2.2"/>
          </g>

          <!-- mic grille, like the real thing: a row of pinholes under the player LEDs -->
          <g fill="var(--pa-ic-f)">
            <circle cx="577" cy="200" r="1.3"/><circle cx="584.6" cy="200" r="1.3"/>
            <circle cx="592.2" cy="200" r="1.3"/><circle cx="599.8" cy="200" r="1.3"/>
            <circle cx="607.4" cy="200" r="1.3"/><circle cx="615" cy="200" r="1.3"/>
            <circle cx="622.6" cy="200" r="1.3"/>
          </g>

          <!-- create / options: canted pills, following the shell's slope -->
          <rect fill="var(--pa-small)" stroke="var(--pa-ol-a)" x="478" y="66" width="9" height="22" rx="4.5" transform="rotate(-12 482.5 77)"/>
          <rect fill="var(--pa-small)" stroke="var(--pa-ol-a)" x="713" y="66" width="9" height="22" rx="4.5" transform="rotate(12 717.5 77)"/>

          <!-- d-pad: four separate buttons, like the real thing -->
          <g fill="var(--pa-dpad)" stroke="var(--pa-ol-a)">
            <rect x="434" y="120" width="22" height="26" rx="8"/>
            <rect x="434" y="158" width="22" height="26" rx="8"/>
            <rect x="412" y="141" width="26" height="22" rx="8"/>
            <rect x="452" y="141" width="26" height="22" rx="8"/>
          </g>

          <!-- face buttons -->
          <g>
            <circle fill="var(--pa-btn)" stroke="var(--pa-ol-b)" cx="755" cy="118" r="15.5"/>
            <circle fill="var(--pa-btn)" stroke="var(--pa-ol-b)" cx="789" cy="152" r="15.5"/>
            <circle class="pad-cross-btn" fill="var(--pa-btn)" stroke="var(--pa-ol-b)" cx="755" cy="186" r="15.5"/>
            <circle fill="var(--pa-btn)" stroke="var(--pa-ol-b)" cx="721" cy="152" r="15.5"/>
            <path stroke="var(--pa-tri)" d="M755,111 L761.5,123 L748.5,123 Z" fill="none" stroke-width="1.8" stroke-linejoin="round" opacity="0.9"/>
            <circle stroke="var(--pa-cir)" cx="789" cy="152" r="6" fill="none" stroke-width="1.8" opacity="0.9"/>
            <path class="g-cross" stroke="var(--pa-cross)" d="M750,181 L760,191 M760,181 L750,191" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
            <rect stroke="var(--pa-sq)" x="716" y="147" width="10" height="10" fill="none" stroke-width="1.8" opacity="0.9"/>
            <circle class="pad-cross-tint" cx="755" cy="186" r="15.5" fill="var(--accent)" opacity="0"/>
          </g>

          <!-- sticks: dark caps in both rooms, like the real hardware.
               The cap + its inner ring are grouped so they can travel; the
               well is the recessed housing and must stay put, or the whole
               socket slides and it reads as the pad melting. -->
          <g>
            <circle fill="var(--pa-well)" stroke="var(--pa-ol-a)" cx="515" cy="238" r="37"/>
            <g class="pad-stick pad-stick-l">
              <circle stroke="var(--pa-ol-b)" cx="515" cy="238" r="28" fill="url(#stickGrad)"/>
              <circle cx="515" cy="238" r="19" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="3"/>
            </g>
            <circle fill="var(--pa-well)" stroke="var(--pa-ol-a)" cx="685" cy="238" r="37"/>
            <g class="pad-stick pad-stick-r">
              <circle stroke="var(--pa-ol-b)" cx="685" cy="238" r="28" fill="url(#stickGrad)"/>
              <circle cx="685" cy="238" r="19" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="3"/>
            </g>
          </g>

          <!-- home + mic slot -->
          <circle stroke="var(--pa-ic)" cx="600" cy="234" r="9" fill="none" stroke-width="1.2"/>
          <rect fill="var(--pa-small)" stroke="var(--pa-ol-a)" x="588" y="262" width="24" height="5" rx="2.5"/>
        </g>

        <!-- annotation LEADERS ONLY. The label and body strings are HTML, from
             _data/pads.json, laid over this plate by _includes/bands/hero.html;
             the .ann dN class pairs each leader with its text so both fade in
             on the same beat. Nothing here is copy, so redrawing the silhouette
             costs you these polylines and not a word of prose.
             Left column: leader ends on the x=312 guide, rows on a 100px
             rhythm (60/160/260/360). One leader treatment throughout:
             dot on the control → straight diagonal → elbow → 14px run to the guide -->
        <g class="ann d1">
          <circle cx="404" cy="42" r="2.5"/>
          <polyline points="404,42 334,64 320,64"/>
        </g>
        <g class="ann d2">
          <circle cx="528" cy="152" r="2.5"/>
          <polyline points="528,152 334,164 320,164"/>
        </g>
        <g class="ann d3">
          <circle cx="478" cy="262" r="2.5"/>
          <polyline points="478,262 334,264 320,264"/>
        </g>
        <g class="ann d4">
          <circle cx="452" cy="340" r="2.5"/>
          <polyline points="452,340 334,364 320,364"/>
        </g>
        <!-- right column: leader ends on the x=888 guide, same rhythm -->
        <g class="ann d5">
          <circle cx="800" cy="38" r="2.5"/>
          <polyline points="800,38 866,64 880,64"/>
        </g>
        <g class="ann d6">
          <circle cx="806" cy="140" r="2.5"/>
          <polyline points="806,140 866,164 880,164"/>
        </g>
        <g class="ann d7">
          <circle cx="722" cy="262" r="2.5"/>
          <polyline points="722,262 866,264 880,264"/>
        </g>
        <g class="ann d8">
          <circle cx="846" cy="414" r="2.5"/>
          <polyline points="846,414 866,364 880,364"/>
        </g>
      </svg>