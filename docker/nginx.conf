server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No caching in dev: the whole point of the bind mount is that a save shows up
  # on reload. nginx's default expires would fight that, and a stale home.css is
  # exactly the kind of thing that wastes half an hour.
  add_header Cache-Control "no-store, must-revalidate";
  etag off;

  # Extensionless URLs, so /buy works the way it will in production rather than
  # only /buy.html working locally.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # The repo is the document root, so keep the parts of it that are not the site
  # out of reach: notes, tooling, git, and the gitignored scratch directory.
  location ~ ^/(\.git|docs|scripts|bin|node_modules|scratch|docker)/ {
    return 404;
  }
  location ~ /\. { return 404; }

  types {
    text/html                 html;
    text/css                  css;
    text/javascript           js;
    image/svg+xml             svg;
    image/png                 png;
    image/jpeg                jpg jpeg;
    image/x-icon              ico;
    application/xml           xml;
    text/plain                txt;
    application/octet-stream  webmanifest;
  }
  default_type application/octet-stream;
}
