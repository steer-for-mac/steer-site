server {
  listen 80;
  server_name _;
  # Built output only. The repo is the mount, dist/ is the document root, so
  # notes, tooling and .git are out of reach by construction and the deny-list
  # that used to enforce that is gone.
  root /usr/share/nginx/html/dist;
  index index.html;

  # No caching in dev: the whole point of the bind mount is that a save shows up
  # on reload. nginx's default expires would fight that, and a stale home.css is
  # exactly the kind of thing that wastes half an hour.
  add_header Cache-Control "no-store, must-revalidate";
  etag off;

  # Extensionless URLs, so /buy works the way it will in production rather than
  # only /buy.html working locally.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Dotfiles 404 on principle; everything else outside dist/ is already
  # unreachable, because the document root is dist/.
  location ~ /\. { return 404; }

  types {
    text/html                 html;
    text/css                  css;
    text/javascript           js;
    image/svg+xml             svg;
    image/png                 png;
    image/jpeg                jpg jpeg;
    image/x-icon              ico;
    application/xml           xml;
    text/plain                txt;
    application/octet-stream  webmanifest;
  }
  default_type application/octet-stream;
}
