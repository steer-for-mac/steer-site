<!-- PAD STRIP — the one thin band on the page. Everything else below the hero
     is 700px or taller, so nothing was dense; romm reads packed because it puts
     100-150px strips between its bodies, and this is the honest material for
     one. It sits here, not under the hero, for two reasons: directly below the
     hero it was 200px under that picker and a second picker there buys nothing,
     and "works with the pad you already own" answers the live doubt at the
     moment the price appears. It is a real picker, so a reader seven screens
     down can still tell the page which controller they own instead of silently
     getting PlayStation while half the copy above swaps per pad. -->
<section class="padstrip" aria-label="Supported controllers">
  <div class="padstrip-in">
    <div class="padstrip-lead">Works with the pad <br>you already own</div>
    <div class="tabs" role="tablist" aria-label="Pick your controller">
      <button class="tab" role="tab" data-pad="ps" aria-selected="true">
        <svg class="padglyph" viewBox="305 38 590 407" aria-hidden="true"><use href="assets/svg/pad-art-ps.svg#s"/></svg>
        PlayStation</button>
      <button class="tab" role="tab" data-pad="xb" aria-selected="false">
        <svg class="padglyph" viewBox="305 38 590 407" aria-hidden="true"><use href="assets/svg/pad-art-xb.svg#s"/></svg>
        Xbox</button>
      <button class="tab" role="tab" data-pad="sw" aria-selected="false">
        <svg class="padglyph" viewBox="305 38 590 407" aria-hidden="true"><use href="assets/svg/pad-art-sw.svg#s"/></svg>
        Nintendo</button>
      <button class="tab" role="tab" data-pad="mf" aria-selected="false">
        <svg class="padglyph" viewBox="305 38 590 407" aria-hidden="true"><use href="assets/svg/pad-art-mf.svg#s"/></svg>
        Other</button>
    </div>
    <a class="padstrip-more" href="compatibility.html">See what yours can do&nbsp;<span class="a">→</span></a>
  </div>
</section>
