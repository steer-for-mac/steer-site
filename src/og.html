<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<title>Steer: Open Graph card source</title>
<!--
  Share card for steer.seanfloyd.dev (assets/og.png), exactly 1200x630.

  Render (2x for crispness, then downscale):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --force-device-scale-factor=2 \
      --window-size=1200,630 --hide-scrollbars \
      --screenshot=/tmp/og-2x.png "file://ABSOLUTE/PATH/src/og.html"
    sips -z 630 1200 /tmp/og-2x.png --out src/assets/og.png

  Light, because a feed shows one image whatever the site's theme, and white
  stands out in a dark feed where a dark card disappears. The headline is
  the hero's h1 (bands/home/hero.html); a stale one here ships a stale card
  to every social preview. icon.png is rendered from the app's AppIcon.icon.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #fff;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  .brand {
    position: absolute; left: 72px; top: 64px;
    display: flex; align-items: center; gap: 16px;
    font-size: 34px; font-weight: 700; letter-spacing: -0.02em;
  }
  .brand img { width: 64px; height: 64px; }
  h1 {
    position: absolute; left: 72px; top: 200px;
    font-size: 84px; font-weight: 700; line-height: 1.02; letter-spacing: -0.045em;
  }
  h1 .pain { display: block; color: #86868b; }
  .foot { position: absolute; left: 72px; bottom: 60px; font-size: 24px; color: #6e6e73; }
</style>
</head>
<body>
  <!-- The <main> is for axe (landmark-one-main), not for layout. -->
  <main>
    <div class="brand"><img src="icon.png" alt="" eleventy:ignore />Steer</div>
    <h1><span class="pain">Your keyboard is over there.</span> Your controller is right here.</h1>
    <p class="foot">Mac app · steer.seanfloyd.dev</p>
  </main>
</body>
</html>
