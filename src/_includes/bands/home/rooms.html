<!-- WHO IT'S FOR. Three rooms, each with the job and the button that does it
     there: Defaults.swift (R3 keyboard, R1 + Square undo), arrows advance Keynote. -->
<section class="h-rooms" aria-labelledby="h-rooms-h">
  <div class="h-wrap">
    <h2 id="h-rooms-h">Sofa. Desk. <em>Front of the room.</em></h2>
    <div class="h-rooms-row">
      <figure>
        <img src="assets/life/couch.jpg" eleventy:widths="480,720,960" width="1536" height="1024" sizes="(max-width: 860px) 100vw, 380px" alt="Two people on a sofa laugh as she picks a show with a game controller, a streaming site on the TV behind them.">
        <figcaption><b>Browse and type on the TV</b><span class="h-chip"><span class="h-g">R3</span>Keyboard</span></figcaption>
      </figure>
      <figure>
        <img src="assets/life/editor.jpg" eleventy:widths="480,720,960" width="1536" height="864" sizes="(max-width: 860px) 100vw, 380px" alt="A woman sits back from her desk with a controller in her lap, a video timeline on the monitor.">
        <figcaption><b>Edit from your chair</b><span class="h-chip"><span class="h-g">R1</span>+ <span class="h-g h-sq">□</span>Undo</span></figcaption>
      </figure>
      <figure>
        <img src="assets/life/presenter.jpg" eleventy:widths="480,720,960" width="1536" height="864" sizes="(max-width: 860px) 100vw, 380px" alt="A woman stands with a controller in front of a group, a map on the wall screen beside her.">
        <figcaption><b>Present from anywhere</b><span class="h-chip"><span class="h-g">D-pad</span>Next slide</span></figcaption>
      </figure>
    </div>
  </div>
</section>
