<!-- IS IT FIDDLY? The help card is the answer, and the only controller picture.
     Base buttons: steer SteerCore/Defaults.swift:49-69. Create opens the card. -->
{% macro help(theme) %}<img class="h-{{ 'lt' if theme == 'light' else 'dk' }}" src="assets/app/help-{{ theme }}.png" eleventy:widths="900,1400,2078" width="2078" height="1500" sizes="(max-width: 600px) 230vw, (max-width: 1000px) 100vw, 1000px" loading="lazy" alt="Steer's help card for a DualSense: every button labelled with its job. Left stick moves the mouse, cross is Left Click, circle Right Click, the right stick scrolls and, pressed, opens the on-screen keyboard.">{% endmacro %}
<section class="q q-setup" aria-labelledby="q-setup">
  <div class="head">
    <h2 id="q-setup" class="display"><span class="pain">Is it fiddly to set up?</span> <span>No. Every button already has a job.</span></h2>
    <div class="body"><p>The left stick moves the pointer, ✕ clicks, the right stick scrolls. Forget one? Press Create and this card shows every button for the app you're using.</p></div>
  </div>
  <figure class="proof duo duo-help" data-wire="#hp-a #hp-b">
    <div class="effect"><div class="hcard"><span class="crop c-help">{{ help("light") }}{{ help("dark") }}</span><i class="at" id="hp-b"></i></div></div>
    <div class="cause"><div class="pad" aria-hidden="true"><img src="assets/pads/cut-ps-unlit.png" eleventy:widths="300,600" width="1202" height="778" sizes="250px" loading="lazy" alt=""><svg viewBox="0 0 1502 972"><path class="on" d="M390,88 384,90 379,95 377,99 376,108 378,114 378,120 385,147 392,153 403,155 409,153 416,147 418,141 418,132 411,100 408,94 401,89Z"/></svg><i class="at" id="hp-a"></i></div></div>
    <p class="say say-a" aria-hidden="true">Press Create</p>
    <p class="say say-b" aria-hidden="true">Every button, shown</p>
    <svg class="wire" aria-hidden="true"><path/><circle r="5"/></svg>
    <figcaption class="cap">Steer's help card, for the app you're using. Screenshots taken with a DualSense; button names match your controller.</figcaption>
  </figure>
</section>
