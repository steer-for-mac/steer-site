<form class="ml-form h-join" action="https://seanfloyd.dev/api/steer-mailing-list" method="post">
  <input class="ml-hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <input class="ml-from" type="hidden" name="from" value="">
  <label class="h-sr" for="ml-email-{{ mlId }}">Your email address</label>
  <input class="ml-in" id="ml-email-{{ mlId }}" type="email" name="email" required placeholder="you@example.com" autocomplete="email">
  <button type="submit" class="btn btn-primary">Join the launch list</button>
  <p class="ml-msg" role="status" aria-live="polite"></p>
</form>
<p class="h-join-note">Works with DualSense, Xbox, Switch Pro and 300+ others. One email, the day the trial opens. €19.99 once when it ships.</p>
