<svg viewBox="0 0 1200 440" aria-hidden="true">
        <!-- outlines drawn more than once; the light bar alone is stroked eight times -->
        <defs>
          <path id="psTp" d="M503,52 C545,49 655,49 697,52 C704,53 709,58 708,64 L684,124 C681,140 673,148 659,148 L541,148 C527,148 519,140 516,124 L492,64 C491,58 496,53 503,52 Z"/>
          <path id="psLb" d="M485,66 L509,128 C512,145 522,156 538,156 L662,156 C678,156 688,145 691,128 L715,66" fill="none" stroke-linecap="round"/>
          <ellipse id="psBloom" cx="600" cy="112" rx="195" ry="92" filter="url(#soften)"/>
        </defs>
        <ellipse class="contact" cx="600" cy="432" rx="252" ry="14"/>
        <g class="device">
          <!-- shoulders, drawn before the body so the shell occludes them: only
               the sliver of L2 above the top edge shows. Outboard of the
               corner it stops being a trigger and becomes an ear. -->
          <g id="psShoL">
            <path stroke="var(--pa-ol-a)" d="M404,86 C396,70 397,54 407,46 C417,39 436,37 451,40 C463,43 471,50 472,58 L469,74 Z" fill="url(#trigTopGrad)"/>
            <path stroke="var(--pa-rim)" d="M409,48 C417,40 434,38 448,41" fill="none" stroke-width="1.5" stroke-linecap="round"/>
            <g clip-path="url(#psTrigClip)">
              <path fill="var(--pa-cast)" transform="translate(0,-3)" d="M360,118 C356,110 357,102 362,95 C376,74 400,60 428,53 C442,49 454,50 458,54 C460,57 460,60 458,62 C432,65 408,73 390,85 C378,93 368,102 363,118 Z"/>
            </g>
            <path stroke="var(--pa-ol-a)" d="M360,118 C356,110 357,102 362,95 C376,74 400,60 428,53 C442,49 454,50 458,54 C460,57 460,60 458,62 C432,65 408,73 390,85 C378,93 368,102 363,118 Z" fill="url(#bumpGrad)"/>
            <path stroke="var(--pa-rim)" d="M364,96 C378,75 402,61 430,54" fill="none" stroke-width="1.5" stroke-linecap="round"/>
          </g>
          <use href="#psShoL" transform="matrix(-1 0 0 1 1200 0)"/>

          <!-- body, fitted to a measured front view, not drawn by eye. Three
               things carry the likeness: flat top across the middle 55%, a
               corner turning inside ~14% of the width, a near-straight side for
               half the height before the grips flare. Rounding that corner over
               a third of the height is what made the old outline an ellipse.
               psClip in hero-defs.svg is this same path; change both. -->
          <path stroke="var(--pa-ol-b)" d="M600,48 C660,48 714,49 754,51 C786,53 808,66 824,88 C843,110 860,175 872,243 C877,265 880,296 880,328 C880,344 879,360 875,379 C871,398 864,410 851,418 C838,425 822,432 810,437 C802,438 797,433 795,427 C786,404 768,362 753,320 C747,303 738,286 720,280 C700,284 660,285 600,285 C540,285 500,284 480,280 C462,286 453,303 447,320 C432,362 414,404 405,427 C403,433 398,438 390,437 C378,432 362,425 349,418 C336,410 329,398 325,379 C321,360 320,344 320,328 C320,296 323,265 328,243 C340,175 357,110 376,88 C392,66 414,53 446,51 C486,49 540,48 600,48 Z"
                fill="url(#bodyGrad)" stroke-width="1.5"/>
          <path stroke="var(--pa-rim)" d="M400,74 C424,58 470,50 600,50 C730,50 776,58 800,74" fill="none" stroke-width="2" stroke-linecap="round"/>
          <!-- parting line: down the middle of each grip, not its inner edge -->
          <path stroke="var(--pa-seam)" d="M468,286 C440,312 412,350 396,406" fill="none" stroke-width="2"/>
          <path stroke="var(--pa-seam)" d="M732,286 C760,312 788,350 804,406" fill="none" stroke-width="2"/>

          <!-- light spill inside the body (accent), plus the idle-rainbow hue stack -->
          <g clip-path="url(#psClip)">
            <use class="bloom" fill="var(--accent)" href="#psBloom"/>
            <g class="rbbs" aria-hidden="true">
              <use class="rbb hu1" href="#psBloom"/>
              <use class="rbb hu2" href="#psBloom"/>
              <use class="rbb hu3" href="#psBloom"/>
              <use class="rbb hu4" href="#psBloom"/>
              <use class="rbb hu5" href="#psBloom"/>
              <use class="rbb hu6" href="#psBloom"/>
            </g>
          </g>

          <!-- touchpad: a trapezoid, wider at the top, radius on the bottom
               corners. A rounded rect reads as any pad's trackpad. -->
          <use stroke="var(--pa-ol-b)" fill="url(#padGrad)" href="#psTp"/>

          <!-- light bar: one strip, three sides. It runs unbroken under the
               bottom edge on the hardware; do not split it in two. -->
          <g class="glow">
            <use stroke="var(--accent)" stroke-width="6.5" href="#psLb"/>
            <use stroke="rgba(255,255,255,0.85)" stroke-width="2" href="#psLb"/>
          </g>
          <!-- idle rainbow: six hue copies crossfading on opacity, white core on top -->
          <g class="rbg" aria-hidden="true">
            <use class="rbl hu1" href="#psLb"/>
            <use class="rbl hu2" href="#psLb"/>
            <use class="rbl hu3" href="#psLb"/>
            <use class="rbl hu4" href="#psLb"/>
            <use class="rbl hu5" href="#psLb"/>
            <use class="rbl hu6" href="#psLb"/>
            <use class="rb-core" href="#psLb"/>
          </g>
          <use class="lb-reflect" fill="var(--accent)" href="#psTp"/>

          <!-- player LEDs -->
          <g class="pled" fill="var(--accent)" opacity="0.9">
            <circle cx="584" cy="170" r="2.2"/><circle cx="592" cy="170" r="2.2"/>
            <circle cx="600" cy="170" r="2.2"/><circle cx="608" cy="170" r="2.2"/>
            <circle cx="616" cy="170" r="2.2"/>
          </g>

          <!-- mic grille: a row of pinholes, like the real thing -->
          <g class="mic" fill="var(--pa-ic-f)">
            <circle cx="577" cy="182" r="1.3"/><circle cx="584.6" cy="182" r="1.3"/>
            <circle cx="592.2" cy="182" r="1.3"/><circle cx="599.8" cy="182" r="1.3"/>
            <circle cx="607.4" cy="182" r="1.3"/><circle cx="615" cy="182" r="1.3"/>
            <circle cx="622.6" cy="182" r="1.3"/>
          </g>

          <!-- create / options, outboard of the light bar -->
          <g class="meta">
            <rect fill="var(--pa-small)" stroke="var(--pa-ol-a)" x="470" y="72" width="9" height="24" rx="4.5" transform="rotate(-12 474.5 84)"/>
            <rect fill="var(--pa-small)" stroke="var(--pa-ol-a)" x="721" y="72" width="9" height="24" rx="4.5" transform="rotate(12 725.5 84)"/>
          </g>

          <!-- d-pad: four buttons, level with the face cluster, both high
               beside the touchpad rather than down among the sticks -->
          <g class="dpad" fill="var(--pa-dpad)" stroke="var(--pa-ol-a)">
            <rect x="435" y="100" width="22" height="28" rx="8"/>
            <rect x="435" y="148" width="22" height="28" rx="8"/>
            <rect x="408" y="127" width="28" height="22" rx="8"/>
            <rect x="456" y="127" width="28" height="22" rx="8"/>
          </g>

          <!-- face buttons -->
          <g class="face">
            <circle fill="var(--pa-btn)" stroke="var(--pa-ol-b)" cx="771" cy="95" r="15.5"/>
            <circle fill="var(--pa-btn)" stroke="var(--pa-ol-b)" cx="807" cy="131" r="15.5"/>
            <circle class="pad-cross-btn" fill="var(--pa-btn)" stroke="var(--pa-ol-b)" cx="771" cy="167" r="15.5"/>
            <circle fill="var(--pa-btn)" stroke="var(--pa-ol-b)" cx="735" cy="131" r="15.5"/>
            <path stroke="var(--pa-tri)" d="M771,88 L777.5,100 L764.5,100 Z" fill="none" stroke-width="1.8" stroke-linejoin="round" opacity="0.9"/>
            <circle stroke="var(--pa-cir)" cx="807" cy="131" r="6" fill="none" stroke-width="1.8" opacity="0.9"/>
            <path class="g-cross" stroke="var(--pa-cross)" d="M766,162 L776,172 M776,162 L766,172" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
            <rect stroke="var(--pa-sq)" x="730" y="126" width="10" height="10" fill="none" stroke-width="1.8" opacity="0.9"/>
            <circle class="pad-cross-tint" cx="771" cy="167" r="15.5" fill="var(--accent)" opacity="0"/>
          </g>

          <!-- sticks: dark caps in both rooms. Cap and ring are grouped so they
               can travel; the well must stay put, or the socket slides and the
               pad reads as melting. Tucked under the light bar, which is what
               leaves the chin, and the chin is most of what tells a DualSense
               from a Pro Controller. -->
          <g class="sticks">
            <circle fill="var(--pa-well)" stroke="var(--pa-ol-a)" cx="515" cy="200" r="37"/>
            <g class="pad-stick pad-stick-l">
              <circle stroke="var(--pa-ol-b)" cx="515" cy="200" r="28" fill="url(#stickGrad)"/>
              <circle cx="515" cy="200" r="19" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="3"/>
            </g>
            <circle fill="var(--pa-well)" stroke="var(--pa-ol-a)" cx="685" cy="200" r="37"/>
            <g class="pad-stick pad-stick-r">
              <circle stroke="var(--pa-ol-b)" cx="685" cy="200" r="28" fill="url(#stickGrad)"/>
              <circle cx="685" cy="200" r="19" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="3"/>
            </g>
          </g>

          <!-- home + mic slot, on the chin -->
          <g class="chin">
            <circle stroke="var(--pa-ic)" cx="600" cy="207" r="9" fill="none" stroke-width="1.2"/>
            <rect fill="var(--pa-small)" stroke="var(--pa-ol-a)" x="588" y="234" width="24" height="5" rx="2.5"/>
          </g>
        </g>

        <!-- annotation LEADERS ONLY. The strings are HTML from _data/pads.json,
             laid over this plate by bands/hero.html; .ann dN pairs a leader with
             its text so both fade in on one beat. Redrawing the silhouette costs
             these polylines and not a word of prose. Left column ends on the
             x=312 guide, rows on a 100px rhythm (60/160/260/360); dot on the
             control → diagonal → elbow → guide -->
        <g class="ann d1">
          <circle cx="376" cy="42" r="2.5"/>
          <polyline points="376,42 334,64 320,64"/>
        </g>
        <g class="ann d2">
          <circle cx="528" cy="112" r="2.5"/>
          <polyline points="528,112 334,164 320,164"/>
        </g>
        <g class="ann d3">
          <circle cx="486" cy="224" r="2.5"/>
          <polyline points="486,224 334,264 320,264"/>
        </g>
        <g class="ann d4">
          <circle cx="398" cy="344" r="2.5"/>
          <polyline points="398,344 334,364 320,364"/>
        </g>
        <!-- right column: x=888 guide, same rhythm -->
        <g class="ann d5">
          <circle cx="824" cy="42" r="2.5"/>
          <polyline points="824,42 866,64 880,64"/>
        </g>
        <g class="ann d6">
          <circle cx="818" cy="142" r="2.5"/>
          <polyline points="818,142 866,164 880,164"/>
        </g>
        <g class="ann d7">
          <circle cx="714" cy="224" r="2.5"/>
          <polyline points="714,224 866,264 880,264"/>
        </g>
        <g class="ann d8">
          <circle cx="832" cy="408" r="2.5"/>
          <polyline points="832,408 866,364 880,364"/>
        </g>
      </svg>